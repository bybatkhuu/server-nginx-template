name: 2. Build and Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["1. Bump Version"]
    types:
      - completed
  push:
    tags:
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  setup:
    name: Resolve Version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get latest version
        run: |
          git pull origin main
          echo "Current version: v$(./scripts/get-version.sh)"
      - name: Resolve version
        id: resolve
        run: echo "version=$(./scripts/get-version.sh)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Publish
    needs: setup
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signed attestations and cache entries
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ${{ vars.DOCKERHUB_USERNAME }}/nginx
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ needs.setup.outputs.version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    name: Trigger Release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Trigger release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run 3.create-release.yml --repo ${{ github.repository }}
